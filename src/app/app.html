<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex min-h-16 max-w-6xl flex-wrap items-center gap-x-6 gap-y-2 px-4 sm:px-6 lg:px-8">
    <a routerLink="/entries" class="flex items-center gap-2.5 py-3 text-base font-bold text-slate-900">
      <span class="grid size-8 place-items-center rounded-full bg-indigo-600 text-white">
        <app-icon name="clock" cls="size-5" />
      </span>
      Time Tracker
    </a>

    <nav class="flex self-stretch" aria-label="Main">
      <a routerLink="/entries" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="top-link">Timesheet</a>
      <a routerLink="/tree" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="top-link">Clients &amp; projects</a>
    </nav>

    <div class="ml-auto flex items-center gap-2 rounded-full border border-slate-200 px-3 py-1.5 text-xs text-slate-600"
         [title]="'The API allows ' + limit + ' requests per minute'">
      <span class="flex gap-0.5" aria-hidden="true">
        @for (bar of bars(); track $index) {
          <span class="h-3 w-1 rounded-sm" [class]="bar"></span>
        }
      </span>
      API: {{ limiter.remaining() }} of {{ limit }} requests left this minute
    </div>
  </div>
</header>

@if (limiter.waitSeconds() > 0) {
  <div role="status" class="border-b border-amber-200 bg-amber-50 px-4 py-2.5 text-center text-sm text-amber-900">
    <span class="mr-2 inline-block size-3.5 animate-spin rounded-full border-2 border-amber-300 border-t-amber-700 align-[-2px]" aria-hidden="true"></span>
    The API allows {{ limit }} requests per minute. Your request continues in {{ limiter.waitSeconds() }} s.
  </div>
}

<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
  <router-outlet />
</main>

<app-modal />
