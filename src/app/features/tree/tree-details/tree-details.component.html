@if (level() === 'projects') {
  <div class="mb-6">
    <h1 class="text-2xl font-bold tracking-tight text-slate-900">{{ clientName() }}</h1>
    <p class="mt-1 text-sm text-slate-600">{{ clientDescription() }}</p>
  </div>
}

<div class="grid items-start gap-5 md:grid-cols-[260px_minmax(0,1fr)]">
  <aside class="card p-3 md:sticky md:top-4" aria-label="Where you are">
    <button type="button" class="flex min-h-10 w-full items-center gap-2 rounded-lg px-2 text-sm font-semibold text-indigo-700 hover:bg-indigo-50" (click)="back()">
      <app-icon name="chevron" cls="size-4 rotate-180" />
      {{ backLabel() }}
    </button>
    <div class="my-2 h-px bg-slate-200"></div>
    <ul role="tree" aria-label="Current path">
      <li role="treeitem" aria-expanded="true" [attr.aria-selected]="level() === 'projects'">
        <button type="button" (click)="toProjects()"
                class="flex min-h-12 w-full items-center gap-2.5 rounded-lg px-2 py-1.5 text-left hover:bg-slate-50"
                [class]="level() === 'projects' ? 'bg-indigo-50' : ''"
                [attr.aria-current]="level() === 'projects' ? 'page' : null">
          <span class="grid size-7 shrink-0 place-items-center rounded-md bg-indigo-50 text-indigo-600">
            <app-icon name="building" cls="size-4" />
          </span>
          <span class="min-w-0">
            <span class="block text-[11px] tracking-wide text-slate-500 uppercase">Client</span>
            <span class="block truncate font-semibold text-slate-900">{{ clientName() }}</span>
          </span>
        </button>
        @if (projectId()) {
          <ul role="group" class="ml-5">
            <li role="treeitem" aria-expanded="true" [attr.aria-selected]="level() === 'tasks'" class="relative pl-[18px]">
              <span class="absolute top-0 left-0 h-6 w-3.5 rounded-bl-md border-b-2 border-l-2 border-slate-300" aria-hidden="true"></span>
              <button type="button" (click)="toProject()"
                      class="flex min-h-12 w-full items-center gap-2.5 rounded-lg px-2 py-1.5 text-left hover:bg-slate-50"
                      [class]="level() === 'tasks' ? 'bg-indigo-50' : ''"
                      [attr.aria-current]="level() === 'tasks' ? 'page' : null">
                <span class="grid size-7 shrink-0 place-items-center rounded-md bg-sky-50 text-sky-700">
                  <app-icon name="folder" cls="size-4" />
                </span>
                <span class="min-w-0">
                  <span class="block text-[11px] tracking-wide text-slate-500 uppercase">Project</span>
                  <span class="block truncate font-semibold text-slate-900">{{ projectName() }}</span>
                </span>
              </button>
              @if (taskId()) {
                <ul role="group" class="ml-5">
                  <li role="treeitem" aria-selected="true" class="relative pl-[18px]">
                    <span class="absolute top-0 left-0 h-6 w-3.5 rounded-bl-md border-b-2 border-l-2 border-slate-300" aria-hidden="true"></span>
                    <span class="flex min-h-12 items-center gap-2.5 rounded-lg bg-indigo-50 px-2 py-1.5" aria-current="page">
                      <span class="grid size-7 shrink-0 place-items-center rounded-md bg-white text-indigo-500">
                        <app-icon name="task" cls="size-4" />
                      </span>
                      <span class="min-w-0">
                        <span class="block text-[11px] tracking-wide text-slate-500 uppercase">Task</span>
                        <span class="block truncate font-semibold text-slate-900">{{ taskName() }}</span>
                      </span>
                    </span>
                  </li>
                </ul>
              }
            </li>
          </ul>
        }
      </li>
    </ul>
  </aside>

  <div class="min-w-0">
    @if (level() === 'projects') {
      @if (clientId(); as id) {
        <app-project-list [clientId]="id" />
      }
    } @else {
      <router-outlet />
    }
  </div>
</div>
